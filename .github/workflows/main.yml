name: Deploy Main Site 

on: 
  push:
    branches:
      - master
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Copy repository contents to remote server via scp
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.DILOOP_HOST }}
        username: ${{ vars.DILOOP_USER_NAME }}
        port: ${{ vars.DILOOP_PORT }}
        key: ${{ secrets.DILOOPSERVERKEY }}
        source: "."
        target: ${{ vars.DILOOP_BUILD_DIR }}

    - name: Executing remote command via ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.DILOOP_HOST }}
        username: ${{ vars.DILOOP_USER_NAME }}
        port: ${{ vars.DILOOP_PORT }}
        key: ${{ secrets.DILOOPSERVERKEY }}
        script: |
              cd ${{vars.DILOOP_BUILD_DIR}} && pnpm install
              pnpm build
              rm -rf ${{vars.DILOOP_TARGET_DIR}}/*
              cp -ar ${{vars.DILOOP_BUILD_DIR}}/*  ${{vars.DILOOP_TARGET_DIR}}
              rm -rf ${{vars.DILOOP_BUILD_DIR}}/*
              pm2 restart reactdiloop
